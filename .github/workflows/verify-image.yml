name: Verify Image

# 从 Docker Hub 拉取已发布镜像，实际运行并验证路由，
# 确保「能构建」之外还「能跑起来」——包括只读根文件系统这种加固参数。
#
# 触发：Docker Publish 成功后自动执行，或手动触发

on:
  workflow_run:
    workflows: ["Docker Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '要验证的镜像标签'
        type: string
        default: latest

jobs:
  smoke:
    name: 拉取镜像并冒烟验证
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 检出代码（复用 verify.sh）
        uses: actions/checkout@v4

      - name: 拉取镜像
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          echo "验证镜像: yinuxy/ziwei-doushu:$TAG"
          docker pull "yinuxy/ziwei-doushu:$TAG"

      - name: 以加固参数运行（只读根 + 非 root + cap_drop）
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          docker run -d --name ziwei \
            -p 127.0.0.1:3000:3000 \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            -v ziwei-cache:/app/.next/cache \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 512m \
            "yinuxy/ziwei-doushu:$TAG"

      - name: 等待健康检查通过
        run: |
          for i in $(seq 1 30); do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ziwei 2>/dev/null || echo none)
            echo "[$i] health=$health"
            if [ "$health" = "healthy" ]; then
              echo "健康检查通过"; exit 0
            fi
            sleep 3
          done
          echo "健康检查未通过，容器日志："
          docker logs --tail 60 ziwei
          exit 1

      - name: 路由冒烟验证
        run: bash deploy/docker/verify.sh http://127.0.0.1:3000

      - name: 验证非 root 运行
        run: |
          uid=$(docker exec ziwei id -u)
          echo "容器内 uid=$uid"
          [ "$uid" = "1001" ] || { echo "预期非 root(1001)，实际 $uid"; exit 1; }

      - name: 验证只读根文件系统
        run: |
          if docker exec ziwei touch /app/should-fail 2>/dev/null; then
            echo "根文件系统可写，read_only 未生效"; exit 1
          else
            echo "根文件系统只读，符合预期"
          fi

      - name: 失败时输出日志
        if: failure()
        run: docker logs --tail 100 ziwei || true

      - name: 清理
        if: always()
        run: docker rm -f ziwei || true

  compose-smoke:
    name: 用本地部署 compose 文件验证
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 用 docker-compose.local.yml 启动
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          echo "使用镜像标签: $TAG"
          IMAGE_TAG="$TAG" docker compose \
            -f deploy/docker/docker-compose.local.yml \
            up -d --wait --wait-timeout 120

      - name: 查看容器状态
        run: docker compose -f deploy/docker/docker-compose.local.yml ps

      - name: 路由冒烟验证
        run: bash deploy/docker/verify.sh http://127.0.0.1:8090

      - name: 验证加固项生效
        run: |
          set -e
          uid=$(docker exec ziwei-web id -u)
          echo "容器内 uid=$uid"
          [ "$uid" = "1001" ] || { echo "预期非 root(1001)，实际 $uid"; exit 1; }

          if docker exec ziwei-web touch /app/should-fail 2>/dev/null; then
            echo "根文件系统可写，read_only 未生效"; exit 1
          fi
          echo "根文件系统只读，符合预期"

          # 缓存卷必须对 uid 1001 可写，否则图片优化会 500
          docker exec ziwei-web sh -c 'touch /app/.next/cache/.probe && rm -f /app/.next/cache/.probe'
          echo "缓存卷可写，符合预期"

      - name: 失败时输出日志
        if: failure()
        run: docker compose -f deploy/docker/docker-compose.local.yml logs --tail 80 || true

      - name: 清理
        if: always()
        run: docker compose -f deploy/docker/docker-compose.local.yml down -v || true
